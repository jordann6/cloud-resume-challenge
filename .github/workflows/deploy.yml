name: Deploy to S3
on:
  push:
    branches: [main]
  workflow_dispatch:
# Opt JavaScript actions into the Node.js 24 runtime (Node 20 is deprecated on runners).
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build static export
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      # Only /_next/ filenames carry a content hash, so only those are safe to
      # freeze. Everything else (HTML, og.png, robots.txt, sitemap.xml) keeps a
      # stable URL and therefore needs a short TTL.
      - name: Sync hashed build assets (immutable, long cache)
        run: |
          aws s3 sync out/_next/ s3://jordandesigns.io/_next/ --delete \
            --cache-control "max-age=31536000,public,immutable"

      - name: Sync stable-URL files (short cache)
        run: |
          aws s3 sync out/ s3://jordandesigns.io --delete \
            --exclude "_next/*" \
            --cache-control "max-age=300,public"

      - name: Invalidate CloudFront cache
        run: aws cloudfront create-invalidation --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} --paths "/*"
